name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Installera beroenden
        run: npm ci
      - name: Kontrollera syntax i alla JavaScript-filer
        run: |
          for f in index.js crypt.js database/*.js routes/*.js; do
            node --check "$f"
          done
