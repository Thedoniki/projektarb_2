<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frågeforum med roller – klickbar prototyp</title>
<style>
  :root { --primary:#2b5876; --accent:#4e4376; --bg:#f5f6f8; --card:#fff; --text:#222; --muted:#666; --danger:#b03a2e; --ok:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  header .logo { font-weight:700; font-size:1.2rem; cursor:pointer; }
  header .sp { flex:1; }
  main { max-width:820px; margin:0 auto; padding:20px 24px 40px; }
  .card { background:var(--card); border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:18px; margin-bottom:12px; }
  .roles { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .roles .card { cursor:pointer; text-align:center; }
  .roles .card:hover { box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .btn { padding:8px 14px; border:0; border-radius:6px; background:var(--primary); color:#fff; cursor:pointer; font-size:.95rem; }
  .btn:hover { background:var(--accent); }
  .btn.sec { background:#dde3ea; color:var(--text); }
  .btn.danger { background:var(--danger); }
  .btn.light { background:#fff; color:var(--primary); }
  .muted { color:var(--muted); font-size:.88rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  input, textarea { width:100%; padding:9px; border:1px solid #cfd6df; border-radius:6px; font:inherit; margin-bottom:10px; }
  label { font-size:.85rem; color:var(--muted); display:block; margin-bottom:3px; }
  .tag { display:inline-block; background:#e8eef5; color:var(--primary); border-radius:12px; padding:2px 10px; font-size:.8rem; }
  .note { background:#fff8e1; border-left:4px solid #f0b400; padding:10px 12px; border-radius:6px; font-size:.9rem; margin-bottom:12px; }
  .msg { padding:10px 12px; border-radius:6px; margin-bottom:12px; background:#e8f5e9; color:var(--ok); display:none; }
</style>
</head>
<body>
<header>
  <span class="logo" onclick="logout()">Frågeforum</span>
  <span class="sp"></span>
  <span id="who" class="muted" style="color:#fff"></span>
  <button class="btn light" id="out" style="display:none" onclick="logout()">Logga ut</button>
</header>
<main><div class="msg" id="msg"></div><div id="app"></div></main>

<script>
  // Exempeldata. Allt sparas bara i minnet.
  const accounts = { Consumer:{ user:'konsument', pass:'1234' }, Contributor:{ user:'bidrag', pass:'1234' }, 'Super Admin':{ user:'admin', pass:'1234' } };
  const questions = [
    { id:1, title:'Vad är SQLite?', text:'En filbaserad databas.', category:'Databas', user:'konsument' },
    { id:2, title:'Hur använder jag bcrypt?', text:'Hur hashar jag ett lösenord?', category:'Säkerhet', user:'konsument' },
    { id:3, title:'Vad är Express?', text:'Ett ramverk för Node.js.', category:'Teknik', user:'annan' }
  ];
  const categories = ['Databas', 'Säkerhet', 'Teknik'];
  let role = null, user = null, loginFor = null, editing = null;
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function flash(t) { const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 2500); }
  function logout() { role = user = loginFor = editing = null; render(); }

  function startView() {
    return `<h2>Välj roll</h2><div class="roles">
      ${Object.keys(accounts).map(r => `<div class="card" onclick="loginFor='${r}';render()"><h3>${r}</h3><div class="muted">Logga in som ${r}</div></div>`).join('')}
    </div>`;
  }
  function loginView() {
    const a = accounts[loginFor];
    return `<div class="card" style="max-width:420px"><h2>Logga in som ${esc(loginFor)}</h2>
      <p class="muted">Demokonto: ${a.user} / ${a.pass}</p>
      <label>Användarnamn</label><input id="u" value="${a.user}">
      <label>Lösenord</label><input id="p" type="password" value="${a.pass}">
      <div class="row"><button class="btn sec" onclick="loginFor=null;render()">Tillbaka</button><button class="btn" onclick="doLogin()">Logga in</button></div></div>`;
  }
  function doLogin() {
    const a = accounts[loginFor];
    if (document.getElementById('u').value !== a.user || document.getElementById('p').value !== a.pass) return alert('Fel användarnamn eller lösenord.');
    role = loginFor; user = a.user; loginFor = null; render();
  }

  function qCard(q, canEdit) {
    return `<div class="card"><div class="row"><div><span class="tag">${esc(q.category)}</span>
      <h3 style="margin:8px 0 4px">${esc(q.title)}</h3><div>${esc(q.text)}</div><div class="muted">av ${esc(q.user)}</div></div>
      ${canEdit ? `<div><button class="btn sec" onclick="editing=${q.id};render()">Ändra</button> <button class="btn danger" onclick="delQ(${q.id})">Ta bort</button></div>` : ''}</div></div>`;
  }
  function formCard(q, withCategory) {
    return `<div class="card"><h3>${q ? 'Ändra fråga' : 'Ny fråga'}</h3>
      <label>Titel</label><input id="t" maxlength="30" value="${esc(q?.title)}">
      <label>Text</label><textarea id="x" rows="3">${esc(q?.text)}</textarea>
      <label>Kategori</label><input id="c" list="cats" value="${esc(q?.category || categories[0])}"><datalist id="cats">${categories.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="row"><button class="btn sec" onclick="editing=null;render()">Avbryt</button><button class="btn" onclick="saveQ(${q ? q.id : 'null'})">Spara</button></div></div>`;
  }
  function dashboard() {
    if (role === 'Consumer') {
      const mine = questions.filter(q => q.user === user);
      return `<div class="row"><h2>Mina frågor</h2><button class="btn" onclick="editing=0;render()">+ Ny fråga</button></div>
        ${editing === 0 ? formCard(null) : ''}
        ${mine.map(q => editing === q.id ? formCard(q) : qCard(q, true)).join('') || '<p class="muted">Du har inga frågor än.</p>'}`;
    }
    if (role === 'Contributor') {
      return `<h2>Alla frågor</h2>
        <div class="note">Att svara på frågor är inte färdigt i backend ännu. Den här vyn visar bara frågorna.</div>
        ${questions.map(q => qCard(q, false)).join('')}`;
    }
    return `<div class="row"><h2>Alla frågor</h2><div><button class="btn sec" onclick="addCat()">+ Ny kategori</button> <button class="btn" onclick="editing=0;render()">+ Ny fråga</button></div></div>
      <div class="muted" style="margin-bottom:10px">Kategorier: ${categories.map(esc).join(', ')}</div>
      ${editing === 0 ? formCard(null) : ''}
      ${questions.map(q => editing === q.id ? formCard(q) : qCard(q, true)).join('')}`;
  }
  function saveQ(id) {
    const t = document.getElementById('t').value.trim(), x = document.getElementById('x').value.trim(), c = document.getElementById('c').value.trim();
    if (!t || !x || !c) return alert('Fyll i titel, text och kategori.');
    if (id) Object.assign(questions.find(q => q.id === id), { title:t, text:x, category:c });
    else questions.push({ id: Date.now(), title:t, text:x, category:c, user });
    if (!categories.includes(c)) categories.push(c);
    editing = null; flash('Sparat.'); render();
  }
  function delQ(id) { if (confirm('Ta bort frågan?')) { questions.splice(questions.findIndex(q => q.id === id), 1); render(); } }
  function addCat() { const n = prompt('Ny kategori:'); if (n && !categories.includes(n)) { categories.push(n); render(); } }

  function render() {
    document.getElementById('who').textContent = role ? `${role}: ${user}` : '';
    document.getElementById('out').style.display = role ? '' : 'none';
    app.innerHTML = role ? dashboard() : loginFor ? loginView() : startView();
  }
  render();
</script>
</body>
</html>
